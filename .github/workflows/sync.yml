name: Sync & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max list pages to scan (default 3)"
        required: false
        default: "3"

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: pip install requests beautifulsoup4

      - name: Sync new posts
        run: python scripts/sync.py --max-pages "${{ inputs.max_pages || '3' }}"

      - name: "Add short links (test batch: chunmomo)"
        env:
          SHRTFLY_API_KEY: ${{ secrets.SHRTFLY_API_KEY }}
        run: python scripts/add_shortlinks.py --model 蠢沫沫

      - name: Generate models data
        run: python scripts/gen_models_data.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ scripts/cache/ data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync: update posts [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: |
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              echo "push ok on attempt $i"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "push attempt $i failed, retry in 60s..."
              sleep 60
            fi
          done
          echo "::error::push failed after 3 attempts"
          exit 1

      - name: Setup Hugo
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Build
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        run: |
          hugo --minify
          rm -rf public/categories/coser/page  # 模特墙无分页，删除自动生成的重复副本

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=4kupcos
